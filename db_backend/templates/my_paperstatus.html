<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Paper Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: relative; /* To position the arrow relative to the container */
        }

        .arrow-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5em;
            text-decoration: none;
            color: #007bff;
        }

        .arrow-icon:hover {
            color: #0056b3;
        }

        .article-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .article-icon {
            width: 60px;
            height: 60px;
            background: #ddd;
            border-radius: 10px;
        }

        .article-details {
            flex-grow: 1;
        }

        .article-title {
            font-size: 1.5em;
            margin: 0;
        }

        .article-meta {
            color: #666;
            font-size: 0.9em;
        }

        .preferences {
            margin-top: 10px;
        }

        .preferences a {
            text-decoration: none;
            color: #007bff;
        }

        .preferences a:hover {
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th,
        table td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        table th {
            background-color: #f7f7f7;
        }

        .status-button {
            padding: 5px 10px;
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .status-button:hover {
            background-color: #138496;
        }

        .resubmit-link {
            color: #dc3545;
            text-decoration: none;
        }

        .resubmit-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Add Arrow Icon -->
        <a href="{{ url_for('reviews_received') }}" class="arrow-icon" title="Go to Reviews Received">&rarr;</a>

        <!-- Article Details -->
        <div class="article-header">
            <div class="article-icon"></div>
            <div class="article-details">
                <h1 class="article-title">Article Title</h1>
                <p class="article-meta">By <strong>Author's Name</strong> | Published: 2024-12-19</p>
                <p>Description of the article goes here. Brief and concise, not exceeding a few lines.</p>
                <div class="preferences">
                    <a href="#">Edit Preferences</a>  <a href="#"></a>
                </div>
            </div>
        </div>

        <!-- Reviewer Information -->
        <h2>Reviewer Information</h2>
        <table>
            <thead>
                <tr>
                    <th>Reviewer ID</th>
                    <th>Status</th>
                    <th>Reviews</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Reviewer_2</td>
                    <td>Needs Resubmission</td>
                    <td>
                        <a href="{{ url_for('resubmit') }}" class="resubmit-link">Resubmit</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        async function fetchArticleData(articleId) {
            try {
                const response = await fetch(`http://127.0.0.1:5000/api/articles/${articleId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }
                const data = await response.json();
    
                // Populate article details
                document.querySelector('.article-title').textContent = data.article.title;
                document.querySelector('.article-meta').textContent =
                    `By ${data.article.author} | Published: ${data.article.publish_date}`;
                document.querySelector('.article-details > p').textContent = data.article.description;
    
                // Populate reviewer table
                const tableBody = document.querySelector('table tbody');
                tableBody.innerHTML = '';
                data.reviewers.forEach(reviewer => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${reviewer.name}</td>
                        <td>${reviewer.status}</td>
                        <td>
                            ${reviewer.status === 'Needs Resubmission'
                                ? `<a href="{{ url_for('resubmit') }}" class="resubmit-link">Resubmit</a>`
                                : `<button class="status-button" onclick="navigateToReview(${reviewer.id})">View Review</button>`}
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }
    
        // Example: Fetch data for article with ID 1
        fetchArticleData(1);
    
        function navigateToReview(reviewerId) {
            window.location.href = `{{ url_for('reviews_received') }}?reviewer=${reviewerId}`;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviewing Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        h1 {
            text-align: center;
        }

        .paper-details {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 5px;
            background: #f9f9f9;
        }

        textarea {
            width: 100%;
            height: 150px;
            margin-top: 10px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Review Paper</h1>
    <p><a href="{{ url_for('reviewer_dashboard') }}">Back to Reviewer Dashboard</a></p>

    <div class="paper-details">
        <h2>{{ paper.title }}</h2>
        <p><strong>Author:</strong> {{ paper.author.first_name }} {{ paper.author.last_name }}</p>
        <p><strong>Abstract:</strong> {{ paper.abstract }}</p>
        <p><strong>Submission Date:</strong> {{ paper.submit_date.strftime('%Y-%m-%d') }}</p>
        <a href="{{ url_for('download_paper', paper_id=paper.id) }}">Download Full Paper</a>
    </div>

    <form method="POST" action="{{ url_for('submit_review', paper_id=paper.id) }}">
        <label for="review_comments">Your Comments:</label>
        <textarea id="review_comments" name="review_comments" required></textarea>
        <button type="submit">Submit Review</button>
    </form>
</body>
</html>

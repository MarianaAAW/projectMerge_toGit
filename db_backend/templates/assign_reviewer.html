<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign a Reviewer</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            color: #333;
            text-align: center;
        }

        /* Header Section */
        .header {
            margin-top: 50px;
        }

        .header img {
            width: 80px;
            height: auto;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin: 20px 0;
        }

        

        /* Table Section */
        .table-container {
            margin: 40px auto;
            width: 70%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 16px;
        }

        table th, table td {
            text-align: left;
            padding: 12px 20px;
            border: 1px solid #ddd;
        }

        table th {
            background-color: #f3ebf7;
            color: #333;
        }

        table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-red {
            background-color: #e74c3c;
            color: white;
        }

        .btn-red:hover {
            background-color: #c0392b;
        }

        .btn-green {
            background-color: #27ae60;
            color: white;
        }

        .btn-green:hover {
            background-color: #229954;
        }
    </style>
</head>
<body>
<!-- Table Section -->
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>User Name</th>
                <th>Preferences</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
                <tr>
                    {% for user in users %}
<tr>
    <td>{{ user.first_name }} {{ user.last_name }}</td>
    <td>{{ user.preferences }}</td>
    <td>
        {% if "reviewer" in user.role %}
            <button class="btn btn-green" disabled>Already a Reviewer</button>
        {% else %}
            <form method="post" action="/make_reviewer">
                <input type="hidden" name="user_id" value="{{ user.id }}">
                <button type="submit" class="btn btn-red">Make a Reviewer</button>
            </form>
        {% endif %}
    </td>
</tr>
{% endfor %}
        </tbody>
    </table>
</div>
</body>
